{% assign projects = site.projects | sort: 'n' %}
{% for project in projects %}
<a href="{{ project.url | relative_url }}" class='project-line project-color--{{ project.project }} tooltip hook'
    data-aos="fade-in" data-aos-delay='200' data-aos-anchor-placement="top-bottom">
    {% if project.img %}
    <span id="{{ project.project }}" data-tooltip-offset="{{ project.tooltip_offset | default: 150 }}" aria-hidden="true">
        <img alt="" src="{{ project.img | relative_url }}">
    </span>
    {% endif %}
    <div class='project-line__header'>
        <h2 class='project-line__title'>
            {{ project.title }}
        </h2>
        <p class='project-line__subline'>{{ project.subline }}</p>
    </div>
    <div class='project-line__details'>
        <p class='project-line__category'>{{ project.category }}</p>
        <p class='project-line__year'>{{ project.year }}</p>
    </div>
</a>
{% endfor %}
