<!DOCTYPE html>
<html lang="en">
{% include head.html %}

<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class='layout'>
        {% include header.html %}
        {{ content }}
        {% if page.permalink == '/' %}
        {% include footer.html %}
        {% else %}
        {% include footer-project.html %}
        {% endif %}
    </div>
    {% if page.title == 'home' %}
    <script src="{{ '/assets/js/tooltip.js' | relative_url }}"></script>
    {% endif %}
    <script src="{{ '/assets/js/transitions.js' | relative_url }}"></script>
    <script src="{{ '/assets/aos/aos.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/init.js' | relative_url }}"></script>
</body>

</html>
